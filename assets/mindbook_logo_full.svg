<svg xmlns="http://www.w3.org/2000/svg"
viewBox="0 0 760 180"
width="100%"
height="100%">

  <defs>

    <linearGradient id="hLeft"
                    x1="0%" y1="0%"
                    x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>

    <linearGradient id="hRight"
                    x1="0%" y1="0%"
                    x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>

  </defs>


  <!-- ======================================================
       EMBLEM
       ====================================================== -->

  <g transform="translate(15, 10) scale(0.38)">

    <!-- Left Wing -->

    <path
        d="M60 350
           L60 175
           L135 128
           L190 265
           L135 376 Z"
        fill="url(#hLeft)"/>

    <!-- Left Fold -->

    <path
        d="M135 128
           L190 265
           L135 230 Z"
        fill="#1E40AF"/>


    <!-- Right Wing -->

    <path
        d="M320 350
           L320 175
           L245 128
           L190 265
           L245 376 Z"
        fill="url(#hRight)"/>

    <!-- Right Fold -->

    <path
        d="M245 128
           L190 265
           L245 230 Z"
        fill="#0369A1"/>


    <!-- Bottom Spine -->

    <path
        d="M60 350
           C110 376, 160 385, 190 398
           C220 385, 270 376, 320 350
           L320 370
           C270 396, 220 405, 190 418
           C160 405, 110 396, 60 370 Z"
        fill="#1E293B"/>

  </g>


  <!-- ======================================================
       MINDBOOK TYPOGRAPHY
       ====================================================== -->

  <text
      x="175"
      y="105"
      font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', 'Inter', 'SF Pro Display', sans-serif"
      font-size="70"
      font-weight="700"
      letter-spacing="-1.5"
      fill="#0F172A">

    Mind<tspan fill="#2563EB">Book</tspan>

  </text>


  <!-- Tagline -->

  <text
      x="178"
      y="138"
      font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif"
      font-size="13.5"
      font-weight="600"
      fill="#64748B"
      letter-spacing="3.5">

    MINDFUL SOCIAL SHARING

  </text>

</svg>
